<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title> </title>
  <style>
    /* Match theme to prevent flash */
    @media (prefers-color-scheme: dark) {
      body { background-color: #1a1a2e; }
    }
    @media (prefers-color-scheme: light) {
      body { background-color: #f8f9fa; }
    }
    
    /* Fullscreen iframe for when focus stealing is disabled */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <script src="browser-polyfill.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
